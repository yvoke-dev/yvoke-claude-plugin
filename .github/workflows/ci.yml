# CI for every push and pull request. Today it runs the docs check; P0-02 adds the plugin checks
# (validate, type-check, tests) to this file.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-docs.mjs
